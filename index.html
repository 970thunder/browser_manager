<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>浏览器多开管理器</title>
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <div class="app-shell">
      <header class="app-header glass-card">
        <div>
          <h1>浏览器多开管理器</h1>
          <p>管理浏览器实例，配置独立数据目录，并一键启动指定页面</p>
        </div>
        <div class="header-actions">
          <div class="chip" id="storageSummary">未设置存储目录</div>
          <button id="openSettings" class="btn icon">设置</button>
        </div>
      </header>

      <main class="layout">
        <section class="panel glass-card">
          <h2>浏览器配置</h2>
          <div class="form-grid">
            <label class="field">
              <span>名称</span>
              <input id="browserName" type="text" placeholder="例如：Chrome 工作环境" />
            </label>
            <label class="field toggle-field">
              <span>启用代理</span>
              <label class="toggle">
                <input id="enableProxy" type="checkbox" />
                <span class="toggle-ui"></span>
              </label>
            </label>
            <label class="field field-wide">
              <span>浏览器可执行文件路径</span>
              <div class="inline-group">
                <input id="executablePath" type="text" placeholder="请选择浏览器可执行文件" />
                <button id="detectKernel" class="btn secondary">查询本机内核</button>
                <button id="pickExecutablePath" class="btn secondary">选择文件</button>
                <button id="installKernel" class="btn secondary">安装内置 Chromium 内核</button>
              </div>
              <div id="installProgress" class="install-progress hidden">
                <div class="install-progress-track">
                  <div id="installProgressFill" class="install-progress-fill"></div>
                </div>
                <div id="installProgressText" class="install-progress-text">准备安装...</div>
              </div>
            </label>
            <label class="field field-wide">
              <span>启动页面 URL（每行一个，启动多个标签页）</span>
              <textarea
                id="startUrls"
                class="textarea"
                placeholder="例如：https://www.example.com&#10;https://www.baidu.com"
              ></textarea>
            </label>
          </div>

          <div class="action-row">
            <button id="saveBrowser" class="btn primary">保存配置</button>
            <button id="resetForm" class="btn secondary">清空表单</button>
          </div>
          <p id="statusMessage" class="status"></p>
        </section>

        <section class="panel glass-card">
          <div class="panel-title">
            <h2>浏览器列表</h2>
            <span id="browserCount">0 个配置</span>
          </div>
          <div id="browserList" class="browser-list"></div>
        </section>
      </main>
    </div>

    <div id="settingsOverlay" class="modal-overlay hidden" aria-hidden="true">
      <div class="modal glass-card" role="dialog" aria-modal="true" aria-label="设置">
        <div class="modal-header">
          <div class="modal-title">设置 <span id="appVersion" class="modal-version"></span></div>
          <button id="closeSettings" class="btn icon">关闭</button>
        </div>
        <div class="modal-body">
          <nav class="modal-nav">
            <button class="nav-item active" data-tab="storage">数据目录</button>
            <button class="nav-item" data-tab="proxy">代理</button>
            <button class="nav-item" data-tab="update">更新</button>
          </nav>
          <section class="modal-panel">
            <div id="tab-storage" class="tab active">
              <div class="tab-title">数据存放目录</div>
              <div class="tab-desc">用于保存各浏览器实例的独立配置与缓存。</div>
              <div class="inline-group modal-inline">
                <input id="settingsDataRootPath" type="text" placeholder="请选择存储目录" />
                <button id="settingsPickDataRootPath" class="btn secondary">选择目录</button>
              </div>
            </div>
            <div id="tab-proxy" class="tab">
              <div class="tab-title">代理配置</div>
              <div class="tab-desc">填写代理提取 API 链接，启动时按需提取并应用到浏览器实例。</div>
              <label class="field field-wide">
                <span>代理 API 链接</span>
                <input
                  id="settingsProxyApiUrl"
                  type="text"
                  placeholder="例如：http://api.xxx.com/v1/get-ip?trade_no=...&secret=...&num=1&format=text"
                />
              </label>
              <div class="hint">
                建议不要在公开环境中暴露 secret；如已泄露，请及时在服务商后台轮换密钥。
              </div>
            </div>
            <div id="tab-update" class="tab">
              <div class="tab-title">手动更新</div>
              <div class="tab-desc">检查是否有新版本，并跳转到下载页面进行更新安装。</div>
              <div class="update-grid">
                <div class="update-row">
                  <div class="update-k">当前版本</div>
                  <div class="update-v" id="currentVersionText">-</div>
                </div>
                <div class="update-row">
                  <div class="update-k">最新版本</div>
                  <div class="update-v" id="latestVersionText">-</div>
                </div>
              </div>
              <label class="field field-wide">
                <span>更新清单 URL（可选）</span>
                <input id="settingsUpdateManifestUrl" type="text" placeholder="例如：https://example.com/browsermanager/latest.json" />
              </label>
              <div class="inline-group">
                <button id="checkUpdate" class="btn secondary">检查更新</button>
                <button id="openDownloadPage" class="btn secondary hidden">打开下载页面</button>
              </div>
              <div id="updateStatus" class="hint"></div>
            </div>

            <div class="modal-actions">
              <button id="saveSettings" class="btn primary">保存设置</button>
            </div>
          </section>
        </div>
      </div>
    </div>

    <script src="./renderer.js"></script>
  </body>
  </html>
